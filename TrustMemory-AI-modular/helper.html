<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Helper Line · TrustMemory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/voice-phone.css">
<style>
  .helper-call-screen { max-width: 420px; margin: 24px auto; }
  .hp-lines { text-align: left; font-size: 13px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
  .hp-line { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; line-height: 1.45; }
  .hp-line .who { font-size: 11px; font-weight: 600; text-transform: uppercase; margin-bottom: 3px; color: var(--brass-dark); }
  .hp-line.me .who { color: var(--teal); }
  .hp-typed { display: flex; gap: 8px; margin-top: 12px; }
  .hp-typed input { flex: 1; padding: 9px 12px; font-size: 13px; border: 1px solid var(--line-strong); border-radius: var(--radius); font-family: inherit; }
  .hp-hint { font-size: 12px; color: var(--ink-soft); margin-top: 10px; min-height: 16px; }
  .hp-listen { font-size: 12px; font-weight: 600; color: var(--rust, #A6453A); margin-top: 8px; }
  .hp-interim { font-style: italic; color: var(--ink-soft); font-size: 12.5px; margin-top: 4px; min-height: 18px; }
</style>
</head>
<body style="background: var(--paper-dim);">
<header class="app-header">
  <div class="brand-wrap">
    <div class="brand-mark">Home-Care Agency</div>
    <span class="brand-tag">Helper Line</span>
  </div>
  <div class="header-status">
    <span class="status-dot" id="lineDot"></span>
    <span id="lineText">Line off</span>
  </div>
</header>

<main class="container">
  <div class="helper-call-screen">
    <div class="helper-avatar" id="hpInitials">·</div>
    <div class="helper-agency-name" id="hpHelperName">Helper</div>
    <h2 class="helper-caller-title" id="hpCaller">Home-Care Agency</h2>
    <div class="helper-call-status" id="hpStatus">Tap below to switch the line on</div>

    <div id="hpLive" style="display:none; margin-bottom: 18px;">
      <div class="timer-val" id="hpTimer" style="font-size: 24px; margin-bottom: 8px;">00:00</div>
      <div class="waveform" id="hpWave" style="justify-content: center; height: 28px;">
        <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
      </div>
    </div>

    <div class="hp-lines" id="hpLines" style="display:none;"></div>

    <div class="helper-controls">
      <div id="ctlActivate">
        <button class="btn primary" id="btnActivate" style="width:100%; padding:12px;">Switch line on</button>
        <div class="hp-hint">Needed once so this screen can ring and speak. Allow the microphone when asked.</div>
      </div>
      <div id="ctlIdle" style="display:none; color: var(--ink-soft); font-size: 13px;">Line on. Waiting for a call from the agency…</div>
      <div id="ctlRinging" style="display:none; gap: 14px; width: 100%;">
        <button class="btn primary" id="btnAccept" style="flex: 1; background: var(--teal); border-color: var(--teal); padding: 12px;">Accept</button>
        <button class="btn danger" id="btnDecline" style="flex: 1; padding: 12px;">Decline</button>
      </div>
      <div id="ctlConnected" style="display:none; width: 100%;">
        <div style="display:flex; gap:8px;">
          <button class="btn" id="btnSpeak" style="flex:1; padding:10px;">🎤 Speak</button>
          <button class="btn danger" id="btnHangup" style="flex:1; padding:10px;">End call</button>
        </div>
        <div class="hp-listen" id="hpListen" style="display:none;">Listening… speak now</div>
        <div class="hp-interim" id="hpInterim"></div>
        <form class="hp-typed" id="hpTypedForm">
          <input id="hpTyped" placeholder="Or type your reply" autocomplete="off">
          <button class="btn sm" type="submit">Send</button>
        </form>
      </div>
      <div id="ctlEnded" style="display:none; color: var(--ink-soft); font-size: 13px;">Call ended. Line returning to standby…</div>
    </div>
    <div class="hp-hint" id="hpHint"></div>
  </div>
</main>

<script src="js/helper-phone.js"></script>
</body>
</html>
