<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>/* theme before first paint */try{var t=localStorage.getItem('tm-theme');if(t!=='dark'&&t!=='light')t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2213%22 fill=%22%23B4863F%22/%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%224%22 fill=%22%23E9C88E%22/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrustMemory AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="css/motion.css">
<link rel="stylesheet" href="css/dark.css">
</head>
<body>
<div id="shell">
  <aside id="rail">
    <div class="brand">
      <div class="mark">TrustMemory AI</div>
    </div>
    <div id="authBox" class="auth-box"></div>
    <nav id="navlist"></nav>
    <div id="railStatus" class="rail-status"></div>
    <div class="rail-foot">
      <button id="resetBtn" title="Reload helpers, calls and memories from the server">Reload data</button>
    </div>
  </aside>
  <div id="main">
    <div id="content"></div>
  </div>
</div>

<!--
  Plain global-scope scripts loaded in dependency order.
-->

<!-- shared foundation -->
<script src="js/state.js"></script>
<script src="js/format-utils.js"></script>
<script src="js/activity-log.js"></script>

<!-- browser-side agent helpers (the agents themselves run on the server) -->
<script src="js/agents/memory-agent.js"></script>
<script src="js/agents/decision-agent.js"></script>
<script src="js/agents/reflection-agent.js"></script>
<script src="js/agents/voice-agent.js"></script>


<!-- UI: charts + router + one file per page -->
<script src="js/ui/charts.js"></script>
<script src="js/ui/memory-ui.js"></script>
<script src="js/ui/render.js"></script>
<script src="js/ui/dashboard.js"></script>
<script src="js/ui/helpers-page.js"></script>
<script src="js/ui/households-page.js"></script>
<script src="js/ui/people-page.js"></script>
<script src="js/ui/memory-page.js"></script>
<script src="js/ui/matching-page.js"></script>
<script src="js/ui/voice-page.js"></script>
<script src="js/ui/voice-live.js"></script>
<script src="js/ui/activity-page.js"></script>
<script src="js/ui/care-ui.js"></script>
<script src="js/ui/outreach-ui.js"></script>


<!-- sign-in and the helper / household views -->
<script src="js/auth.js"></script>
<script src="js/ui/helper-home.js"></script>
<script src="js/ui/household-home.js"></script>

<!-- boot (must be last) -->
<script src="js/ui/requests-ui.js"></script>
<script src="js/ui/theme.js"></script>
<script src="js/ui/polish.js"></script>
<script src="js/ui/motion.js"></script>
<script src="js/main.js"></script>
</body>
</html>
